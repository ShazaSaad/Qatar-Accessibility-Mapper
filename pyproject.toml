[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatar-accessibility-mapper"
version = "0.1.0"
description = "Evidence-backed accessibility information for public venues in Qatar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.4,<1.0",
]
geo = [
    "geopandas>=1.0,<2.0",
    "osmnx>=1.9,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
